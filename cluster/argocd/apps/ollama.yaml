apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://otwld.github.io/ollama-helm
      chart: ollama
      targetRevision: "1.*"
      helm:
        valueFiles:
          - $values/apps/ai/values.yaml
    - repoURL: git@gitlab.com:bc-devops/platform-lab.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
