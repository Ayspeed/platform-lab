apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: platform-lab-ca
  secretName: platform-lab-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
